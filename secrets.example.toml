# Copy to .streamlit/secrets.toml (gitignored) and fill in.
# On Streamlit Community Cloud, paste the same contents into
# App settings → Secrets.

# Password for the Admin page. Without it the Admin page stays locked.
admin_password = "change-me-too"

# Where the SQLite file lives. Optional; defaults to data/registrations.db.
# Note: on Streamlit Community Cloud the filesystem is ephemeral, so
# registrations are lost when the app restarts. Point this at a mounted
# volume, or move to a hosted database, before relying on it.
# db_path = "data/registrations.db"

# Optional: email the handoff note to the Cisco PAM. Off unless send_email = true.
send_email = false
# smtp_host = "smtp.example.com"
# smtp_port = 587
# smtp_user = "intake@example.com"
# smtp_password = "..."
# smtp_from = "intake@example.com"
